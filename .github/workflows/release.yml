name: Build native artifacts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "native-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: native-prebuilts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cypherstack/stackwallet-ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: libepic_cash_wallet-x86_64-unknown-linux-gnu.so
          - target: aarch64-unknown-linux-gnu
            asset: libepic_cash_wallet-aarch64-unknown-linux-gnu.so
    steps:
      - uses: actions/checkout@v6

      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: linux-${{ matrix.target }}

      - name: Build dynamic library
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: |
          cd rust
          cargo build --locked --release --lib --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/libepic_cash_wallet.so" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: rust/${{ matrix.asset }}
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cypherstack/stackwallet-ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            asset: libepic_cash_wallet-aarch64-linux-android.so
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            asset: libepic_cash_wallet-armv7-linux-androideabi.so
          - target: x86_64-linux-android
            abi: x86_64
            asset: libepic_cash_wallet-x86_64-linux-android.so
    steps:
      - uses: actions/checkout@v6

      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-${{ matrix.target }}

      - name: Build dynamic library
        run: |
          cd rust
          cargo ndk --target "${{ matrix.target }}" --platform 24 \
            --link-libcxx-shared --output-dir native-libs \
            build --locked --release --lib
          cp "target/${{ matrix.target }}/release/libepic_cash_wallet.so" "${{ matrix.asset }}"
          cp "native-libs/${{ matrix.abi }}/libc++_shared.so" "libc++_shared-${{ matrix.target }}.so"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            rust/${{ matrix.asset }}
            rust/libc++_shared-${{ matrix.target }}.so
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            sdk: iphoneos
            asset: libepic_cash_wallet-aarch64-apple-ios.dylib
          - target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            asset: libepic_cash_wallet-aarch64-apple-ios-sim.dylib
          - target: x86_64-apple-ios
            sdk: iphonesimulator
            asset: libepic_cash_wallet-x86_64-apple-ios.dylib
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ios-${{ matrix.target }}

      - name: Build dynamic library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          export SDKROOT="$(xcrun --sdk "${{ matrix.sdk }}" --show-sdk-path)"
          cd rust
          cargo build --locked --release --lib --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/libepic_cash_wallet.dylib" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: rust/${{ matrix.asset }}
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: macos-${{ matrix.target }}

      - name: Build dynamic library
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cd rust
          cargo build --locked --release --lib --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/libepic_cash_wallet.dylib" \
            "libepic_cash_wallet-${{ matrix.target }}.dylib"

      - uses: actions/upload-artifact@v4
        with:
          name: libepic_cash_wallet-${{ matrix.target }}.dylib
          path: rust/libepic_cash_wallet-${{ matrix.target }}.dylib
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: windows-x86_64-pc-windows-msvc

      - name: Check native prerequisites
        shell: pwsh
        run: |
          cmake --version
          perl --version

      - name: Build dynamic library
        shell: pwsh
        run: |
          Set-Location rust
          cargo build --locked --release --lib --target x86_64-pc-windows-msvc
          Copy-Item `
            target/x86_64-pc-windows-msvc/release/epic_cash_wallet.dll `
            libepic_cash_wallet-x86_64-pc-windows-msvc.dll

      - uses: actions/upload-artifact@v4
        with:
          name: libepic_cash_wallet-x86_64-pc-windows-msvc.dll
          path: rust/libepic_cash_wallet-x86_64-pc-windows-msvc.dll
          if-no-files-found: error

  release:
    needs:
      - build-linux
      - build-android
      - build-ios
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Assemble manifest and checksums
        run: |
          dart --packages=.dart_tool/package_config.json tool/prebuilt_manifest.dart artifacts
          cp rust/include/epic_cash_wallet.h artifacts/
          cd artifacts
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-release
          path: artifacts/*
          if-no-files-found: error

      - name: Publish a new release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^(native-[A-Za-z0-9][A-Za-z0-9._-]*|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Invalid release tag'; exit 1; }
          source_commit=$(git rev-parse HEAD)
          git fetch --depth=1 --no-tags origin "refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$source_commit" ]] || { echo 'Tag moved during this build'; exit 1; }
          read -r manifest_pin _ < artifacts/manifest.sha256
          cat > "$RUNNER_TEMP/native-release-notes.md" <<EOF
          Native assets built from $source_commit. Use the matching package revision.
          Add these settings to the consuming app's root pubspec.yaml:

              hooks:
                user_defines:
                  flutter_libepiccash:
                    native_build: prebuilt
                    prebuilt_manifest_url: "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json"
                    prebuilt_manifest_sha256: "$manifest_pin"

          Android runtimes are included. See README.md for platform requirements.
          EOF
          # gh release create refuses existing releases and uploads before publishing.
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag --latest=false --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/native-release-notes.md"

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      # The hook builds through the Nix flake; before the first native
      # release that is the only path.
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: flutter pub get
      - run: dart analyze hook tool test lib/epic_cash.dart lib/flutter_libepiccash.dart
      # Prebuilt libraries exist once the lock's release is published from the
      # default branch of the repository dnix.json names; until then only
      # hosts with Nix can build them.
      - name: Check whether the lock's release is published
        id: release
        shell: bash
        run: |
          repository=$(jq -r .repository dnix.json | sed 's/\.git$//; s#/$##')
          tag="native-$(jq -r .release dnix.lock)"
          echo "published=$([ "$(curl -s -o /dev/null -w '%{http_code}' "$repository/releases/tag/$tag")" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Choose the build mode
        shell: bash
        run: echo '${{ steps.release.outputs.published == 'true' && 'prebuilt' || 'source' }}' > .dnix-build
      - name: Run flutter test
        shell: bash
        run: |
          if ! flutter test 2>&1 | tee test.log; then
            echo "::error::$(tail -c 1500 test.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Verify the generated bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          dart run ffigen --config ffigen.yaml
          git diff --exit-code -- lib/src/epic_cash_wallet_bindings.g.dart

  # A Windows process can only use the prebuilt library, so this runs once
  # the lock's release is published from the default branch, and is the
  # one place the Windows DLL is loaded rather than compared by hash.
  windows:
    name: Windows, prebuilt library
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Check whether the lock's release is published
        id: release
        run: |
          repository=$(jq -r .repository dnix.json | sed 's/\.git$//; s#/$##')
          tag="native-$(jq -r .release dnix.lock)"
          echo "published=$([ "$(curl -s -o /dev/null -w '%{http_code}' "$repository/releases/tag/$tag")" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip until the release exists
        if: steps.release.outputs.published != 'true'
        run: echo "::notice::No release $(jq -r .release dnix.lock) yet; the Windows tests run once it is published from the default branch."
      - name: Run flutter test with the prebuilt library
        if: steps.release.outputs.published == 'true'
        run: |
          flutter pub get
          echo prebuilt > .dnix-build
          if ! flutter test 2>&1 | tee test.log; then
            echo "::error::$(tail -c 1500 test.log | tr '\n' ' ')"
            exit 1
          fi

  # The example app builds for macOS and the iOS simulator, as before the
  # native library moved to dnix. Source mode needs the pinned Xcode.
  apple-example-builds:
    name: Example app on macOS and the iOS simulator
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: flutter pub get
      - name: Check whether the lock's release is published
        id: release
        shell: bash
        run: |
          repository=$(jq -r .repository dnix.json | sed 's/\.git$//; s#/$##')
          tag="native-$(jq -r .release dnix.lock)"
          echo "published=$([ "$(curl -s -o /dev/null -w '%{http_code}' "$repository/releases/tag/$tag")" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Choose the build mode
        shell: bash
        run: echo '${{ steps.release.outputs.published == 'true' && 'prebuilt' || 'source' }}' > .dnix-build
      - run: flutter test
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev ninja-build pkg-config
      - name: Run Rust unit tests
        run: cargo test --locked --lib
        working-directory: rust
